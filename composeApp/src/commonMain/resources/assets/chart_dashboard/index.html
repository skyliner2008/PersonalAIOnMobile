<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Chart Dashboard</title>
    <style>
        :root {
            --bg: #131722;
            --text: #b2b5be;
            --accent: #00bcd4;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        #header {
            position: absolute;
            top: 6px; left: 10px;
            z-index: 20;
            font-size: 12px;
            line-height: 1.5;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        #header .sym { font-weight: 700; color: #e8eaf0; font-size: 13px; }
        #header .price { font-weight: 700; font-size: 13px; margin-left: 8px; }
        #header .chg { font-size: 11px; margin-left: 6px; opacity: 0.9; }
        #legend {
            position: absolute;
            top: 24px; left: 10px;
            z-index: 20;
            font-size: 10px;
            opacity: 0.85;
            pointer-events: none;
            line-height: 1.6;
        }
        #chart { width: 100vw; height: 100vh; }
        .loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent); font-weight: bold; font-size: 13px;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div id="header"><span class="sym" id="symLabel">—</span><span class="price" id="priceLabel"></span><span class="chg" id="chgLabel"></span></div>
    <div id="legend"></div>
    <div id="chart"></div>
    <div id="loading" class="loading">Initializing JARVIS Dashboard...</div>
    <script src="../chart/lightweight-charts.js"></script>
    <script src="dashboard_engine.js"></script>
</body>
</html>
